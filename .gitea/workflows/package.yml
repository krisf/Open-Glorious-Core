name: package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install .

      - name: Run test suite
        run: pytest -q --no-header 2>&1 | tail -3

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist

      - name: Create release and upload packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          API: ${{ gitea.server_url }}/api/v1
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          VERSION="${TAG#v}"
          BODY="Open Glorious Core ${TAG} — GMMK Pro stock-firmware remapping for Linux.
          Shipped: keymap panel (slot-60 truth, bind-first writes, effective-types overlay),
          verification listener, factory-safe reset, app icon + dock integration."
          RELEASE_JSON=$(jq -n --arg tag "$TAG" --arg body "$BODY" \
            '{tag_name: $tag, name: $tag, body: $body, target_commitish: "main"}')
          RID=$(curl -sf -X POST "$API/repos/krisf/open-glorious-core/releases" \
            -H "Authorization: token $RELEASE_TOKEN" \
            -H 'Content-Type: application/json' -d "$RELEASE_JSON" | jq -r .id)
          if [ "$RID" = "null" ] || [ -z "$RID" ]; then
            RID=$(curl -sf "$API/repos/krisf/open-glorious-core/releases/tags/$TAG" \
              -H "Authorization: token $RELEASE_TOKEN" | jq -r .id)
          fi
          for f in dist/*; do
            NAME=$(basename "$f")
            echo "attaching $NAME"
            curl -sf -X POST "$API/repos/krisf/open-glorious-core/releases/$RID/assets?name=$NAME" \
              -H "Authorization: token $RELEASE_TOKEN" -F "attachment=@$f"
          done
          echo "release $TAG assets uploaded"
