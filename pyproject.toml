[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-glorious-core"
version = "1.0.0"
description = "Open-source Linux control app for Glorious peripherals"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Maurice de Lauw" }
]
license = "MIT"
dependencies = [
  "PySide6>=6.8,<7",
]
keywords = ["glorious", "keyboard", "mouse", "peripherals", "linux"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware",
]

[project.scripts]
open-glorious-core = "open_glorious_core.app:main"

[project.urls]
Homepage = "https://github.com/MechNoxer/Open-Glorious-Core"
Issues = "https://github.com/MechNoxer/Open-Glorious-Core/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_glorious_core = ["static/*", "static/assets/*", "data/*.bin"]
